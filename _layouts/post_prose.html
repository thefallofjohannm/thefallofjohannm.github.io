---
layout: default
---

<style>
  /* Základní styl pro kontejner prózy */
  .proza-text {
    line-height: 1.7;       /* Příjemná výška řádku pro čtení */
    font-size: 1.1rem;      /* Příjemná velikost písma */
  }

  /* Knižní styl odstavců */
  .proza-text p {
    text-indent: 1.8em;     /* Odsazení prvního řádku odstavce */
    margin-top: 0;
    margin-bottom: 0;       /* Odstavce navazují těsně pod sebou bez mezery */
  }

  /* První odstavec hned pod nadpisem nemá být odsazený (tradiční typografie) */
  .proza-text p:first-of-type {
    text-indent: 0;
  }

  /* Stylování pro oddělovač scén (když v Markdownu napíšeš ***) */
  .proza-text hr {
    border: none;
    text-align: center;
    margin: 1.8em 0;
  }
  .proza-text hr::before {
    content: "* * *";
    color: #777;
    font-size: 1.1em;
  }
</style>

<small>{{ page.date | date: "%-d %B %Y" }}</small>
<p>
  <a href="/{{ page.category | slugify }}/"><b>{{ page.category }}</b></a>{% if page.subcategory %}: {{ page.subcategory }}{% endif %}
</p>
<h1>{{ page.title }}</h1>

<div class="proza-text">
  {{ content }}
</div>

---
layout: default
---

<small>{{ page.date | date: "%-d %B %Y" }}</small>
<p class="post-meta">
  <a href="/{{ page.category | slugify }}/"><b>{{ page.category }}</b></a>{% if page.subcategory %}: {{ page.subcategory }}{% endif %}
</p>
<h1>{{ page.title }}</h1>

<style>
  /* Knižní styl odstavců - standardně s odsazením */
  .proza-text p {
    text-indent: 1.8em;
    margin-top: 0;
    margin-bottom: 0;
  }

  /* Změna scény pomocí *** (vytvoří jen čistou mezeru bez čáry) */
  .proza-text hr {
    border: none;
    height: 0;
    margin: 1em 0; /* Velikost prázdné mezery mezi scénami */
  }
</style>

<div class="proza-text">
  {{ content }}
</div>
